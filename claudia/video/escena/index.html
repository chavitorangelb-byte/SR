<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Render · Claudia Repostería Casera</title>
<style>
@font-face{font-family:"Outfit";font-weight:600;src:url(/web/fonts/outfit-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:700;src:url(/web/fonts/outfit-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:700;src:url(/web/fonts/nunito-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:800;src:url(/web/fonts/nunito-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Playfair Display";font-style:italic;font-weight:600;src:url(/web/fonts/playfair-display-latin-600-italic.woff2) format("woff2")}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#1B1210}
#stage>*{position:absolute}
.full{left:0;top:0;width:1080px;height:1920px}
#bg{left:-200px;top:-200px;width:1480px;height:2320px;background:
  radial-gradient(900px 760px at 26% 22%,rgba(122,100,32,.42),transparent 70%),
  radial-gradient(820px 900px at 86% 72%,rgba(232,165,179,.13),transparent 70%),
  radial-gradient(1000px 700px at 50% 104%,rgba(242,194,60,.16),transparent 70%),
  radial-gradient(1300px 1500px at 50% 46%,#2A1A15,#1B1210 72%)}
#world{left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#phone{position:absolute;left:134px;top:224px;width:812px;height:1432px;transform-origin:50% 50%}
#phone .sombra{position:absolute;left:30px;right:30px;top:60px;bottom:-40px;border-radius:120px;background:rgba(8,4,3,.75);filter:blur(60px)}
#phone .body{position:absolute;inset:0;border-radius:100px;background:linear-gradient(145deg,#2c211d,#0c0706 38%,#150e0c 70%,#33261f);box-shadow:0 0 0 1.5px rgba(255,236,190,.14) inset,0 2px 3px rgba(255,255,255,.18) inset}
#phone .bisel{position:absolute;inset:0;border-radius:100px;padding:5px;background:conic-gradient(from var(--ang,200deg),rgba(255,240,200,0) 0deg,rgba(255,240,200,.75) 28deg,rgba(255,240,200,0) 62deg,rgba(255,240,200,0) 170deg,rgba(255,225,170,.45) 205deg,rgba(255,240,200,0) 240deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
#phone .screen{position:absolute;left:16px;top:16px;width:780px;height:1400px;border-radius:84px;overflow:hidden;background:#fff4dc}
#phone iframe{border:0;width:390px;height:700px;transform:scale(2);transform-origin:0 0;display:block}
#phone .apagada{position:absolute;inset:0;background:#0b0706;border-radius:84px}
#phone .glare{position:absolute;inset:0;border-radius:84px;overflow:hidden;pointer-events:none}
#phone .glare i{position:absolute;inset:-10% -60%;background:linear-gradient(112deg,transparent 40%,rgba(255,250,235,.20) 47%,rgba(255,250,235,.05) 53%,transparent 60%)}
#phone .isla{position:absolute;left:50%;top:34px;width:150px;height:36px;margin-left:-75px;border-radius:20px;background:#0b0706}
#kt{left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.kw{position:absolute;left:0;top:0;white-space:nowrap;font-family:Outfit,sans-serif;font-weight:700;letter-spacing:-.012em;line-height:1;color:#FFF4DC;will-change:transform}
.kw .g{display:inline-block;transform-origin:50% 78%;will-change:transform;text-shadow:0 2px 0 rgba(27,18,16,.35),0 14px 22px rgba(10,5,4,.55)}
.kw.sol{color:#F2C23C}
.kw .placa{position:absolute;inset:-22px -40px -26px;border-radius:34px;background:linear-gradient(160deg,rgba(64,40,31,.78),rgba(27,18,16,.86));-webkit-backdrop-filter:blur(34px) saturate(140%);backdrop-filter:blur(34px) saturate(140%);border:1px solid rgba(255,236,190,.28);box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 30px 50px -24px rgba(0,0,0,.7)}
.kw .placa::after{content:"";position:absolute;inset:0;border-radius:34px;background:var(--ruido);opacity:.5;mix-blend-mode:overlay}
.kw .txt{position:relative}
#flash{background:radial-gradient(700px 500px at var(--fx,946px) var(--fy,940px),rgba(255,236,180,.95),rgba(242,194,60,.35) 40%,transparent 72%);opacity:0;mix-blend-mode:screen}
#vig{background:radial-gradient(120% 86% at 50% 48%,transparent 58%,rgba(8,4,3,.5) 100%)}
canvas{display:block}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <canvas id="pFar" class="full" width="1080" height="1920"></canvas>
  <div id="world">
    <div id="phone">
      <div class="sombra"></div>
      <div class="body"></div>
      <div class="bisel"></div>
      <div class="screen"><iframe id="ui" src="/web/index.html" scrolling="no"></iframe><div class="apagada"></div><div class="glare"><i></i></div></div>
      <div class="isla"></div>
    </div>
  </div>
  <canvas id="line" class="full" width="1080" height="1920"></canvas>
  <canvas id="pMid" class="full" width="1080" height="1920"></canvas>
  <div id="kt"></div>
  <canvas id="pNear" class="full" width="1080" height="1920"></canvas>
  <div id="flash" class="full"></div>
  <div id="vig" class="full"></div>
</div>
<script type="module" src="/video/escena/escena.js"></script>
</body>
</html>
